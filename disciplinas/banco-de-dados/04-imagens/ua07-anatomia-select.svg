<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Anatomia e ordem lógica do SELECT</title><desc id="desc">Esteira de processamento de uma consulta: origem e junção, filtro, agrupamento, filtro de grupos, projeção e ordenação.</desc>
  <rect width="1600" height="900" fill="#eff6ff"/>
  <text x="90" y="105" fill="#172554" font-family="Arial,sans-serif" font-size="54" font-weight="700">UA7 • Leia a consulta como uma esteira</text>
  <text x="92" y="158" fill="#1d4ed8" font-family="Arial,sans-serif" font-size="28">A ordem lógica explica filtros, agregações e resultados.</text>
  <g font-family="Arial,sans-serif">
    <path d="M115 465H1485" stroke="#93c5fd" stroke-width="24" stroke-linecap="round"/>
    <g font-weight="700">
      <rect x="95" y="330" width="220" height="230" rx="30" fill="#1e3a8a"/><text x="125" y="405" fill="white" font-size="31">1 • FROM</text><text x="125" y="450" fill="#bfdbfe" font-size="24">+ JOIN</text><text x="125" y="510" fill="white" font-size="21">origem e relações</text>
      <rect x="335" y="330" width="220" height="230" rx="30" fill="#1d4ed8"/><text x="370" y="405" fill="white" font-size="31">2 • WHERE</text><text x="370" y="465" fill="white" font-size="22">filtra linhas</text>
      <rect x="575" y="330" width="220" height="230" rx="30" fill="#2563eb"/><text x="603" y="405" fill="white" font-size="29">3 • GROUP</text><text x="650" y="446" fill="white" font-size="29">BY</text><text x="615" y="505" fill="#dbeafe" font-size="22">forma grupos</text>
      <rect x="815" y="330" width="220" height="230" rx="30" fill="#3b82f6"/><text x="845" y="405" fill="white" font-size="30">4 • HAVING</text><text x="850" y="465" fill="white" font-size="22">filtra grupos</text>
      <rect x="1055" y="330" width="220" height="230" rx="30" fill="#60a5fa"/><text x="1080" y="405" fill="#172554" font-size="30">5 • SELECT</text><text x="1090" y="465" fill="#172554" font-size="22">projeta colunas</text>
      <rect x="1295" y="330" width="220" height="230" rx="30" fill="#bae6fd"/><text x="1320" y="405" fill="#172554" font-size="29">6 • ORDER</text><text x="1370" y="446" fill="#172554" font-size="29">BY</text><text x="1330" y="505" fill="#172554" font-size="22">ordena a saída</text>
    </g>
    <rect x="170" y="670" width="1260" height="115" rx="28" fill="#dbeafe"/>
    <text x="225" y="720" fill="#172554" font-size="27"><tspan font-weight="700">WHERE</tspan> atua antes do agrupamento • <tspan font-weight="700">HAVING</tspan> atua depois</text>
    <text x="225" y="760" fill="#1e40af" font-size="24">Selecione somente as colunas necessárias e explicite as junções.</text>
  </g>
</svg>

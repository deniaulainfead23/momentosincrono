<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tipos de banco de dados</title><desc id="desc">Mapa de decisão entre bancos relacionais, documentos, grafos, chave-valor e séries temporais.</desc>
  <rect width="1600" height="900" fill="#eef2ff"/>
  <text x="90" y="105" fill="#172554" font-family="Arial,sans-serif" font-size="54" font-weight="700">UA3 • O formato acompanha o problema</text>
  <text x="92" y="158" fill="#3730a3" font-family="Arial,sans-serif" font-size="28">Compare relações, padrão de acesso, consistência, escala e operação.</text>
  <g font-family="Arial,sans-serif">
    <rect x="570" y="215" width="460" height="110" rx="28" fill="#312e81"/><text x="655" y="282" fill="white" font-size="34" font-weight="700">REQUISITOS REAIS</text>
    <path d="M800 325V385M800 385H260V430M800 385H530V430M800 385V430M800 385H1070V430M800 385H1340V430" fill="none" stroke="#6366f1" stroke-width="9"/>
    <rect x="90" y="430" width="340" height="240" rx="28" fill="#2563eb"/><text x="145" y="495" fill="white" font-size="31" font-weight="700">RELACIONAL</text><text x="145" y="545" fill="white" font-size="24">tabelas • chaves</text><text x="145" y="582" fill="white" font-size="24">transações • joins</text><text x="145" y="625" fill="#bfdbfe" font-size="22">vendas, biblioteca</text>
    <rect x="460" y="430" width="260" height="240" rx="28" fill="#059669"/><text x="500" y="495" fill="white" font-size="30" font-weight="700">DOCUMENTOS</text><text x="500" y="545" fill="white" font-size="23">estrutura flexível</text><text x="500" y="582" fill="#a7f3d0" font-size="22">catálogos</text>
    <rect x="750" y="430" width="260" height="240" rx="28" fill="#db2777"/><text x="820" y="495" fill="white" font-size="30" font-weight="700">GRAFO</text><text x="790" y="545" fill="white" font-size="23">nós • arestas</text><text x="790" y="582" fill="#fbcfe8" font-size="22">rotas, redes</text>
    <rect x="1040" y="430" width="220" height="240" rx="28" fill="#ea580c"/><text x="1075" y="495" fill="white" font-size="28" font-weight="700">CHAVE–VALOR</text><text x="1085" y="545" fill="white" font-size="23">acesso direto</text><text x="1085" y="582" fill="#fed7aa" font-size="22">cache, sessão</text>
    <rect x="1290" y="430" width="220" height="240" rx="28" fill="#7c3aed"/><text x="1318" y="488" fill="white" font-size="27" font-weight="700">SÉRIES</text><text x="1310" y="525" fill="white" font-size="27" font-weight="700">TEMPORAIS</text><text x="1328" y="575" fill="white" font-size="23">tempo • medida</text><text x="1328" y="612" fill="#ddd6fe" font-size="22">sensores</text>
    <rect x="90" y="745" width="1420" height="82" rx="22" fill="#c7d2fe"/><text x="155" y="797" fill="#172554" font-size="28"><tspan font-weight="700">Decisão técnica:</tspan> benefício comprovado &gt; complexidade adicionada</text>
  </g>
</svg>


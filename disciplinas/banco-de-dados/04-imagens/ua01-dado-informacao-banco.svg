<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Do mundo real ao banco de dados</title>
  <desc id="desc">Fluxo que transforma leitores, livros e empréstimos em tabelas relacionadas por chaves.</desc>
  <rect width="1600" height="900" fill="#071a2b"/>
  <circle cx="1430" cy="120" r="210" fill="#123a59" opacity=".8"/>
  <text x="90" y="110" fill="#f8fafc" font-family="Arial,sans-serif" font-size="54" font-weight="700">UA1 • Do mundo real ao banco de dados</text>
  <text x="92" y="165" fill="#9bdcf9" font-family="Arial,sans-serif" font-size="28">Organizar é representar relações, não apenas acumular valores.</text>
  <g font-family="Arial,sans-serif">
    <rect x="90" y="250" width="370" height="420" rx="34" fill="#0f6c7a"/>
    <text x="135" y="315" fill="white" font-size="35" font-weight="700">Mundo real</text>
    <circle cx="185" cy="415" r="48" fill="#ffe08a"/><circle cx="355" cy="415" r="48" fill="#ff9f7f"/>
    <text x="135" y="500" fill="white" font-size="27">Leitores</text><text x="310" y="500" fill="white" font-size="27">Livros</text>
    <rect x="145" y="550" width="260" height="66" rx="18" fill="#d6f4ff"/>
    <text x="175" y="593" fill="#07324a" font-size="27" font-weight="700">Empréstimos</text>
    <path d="M500 455H620" stroke="#ffe08a" stroke-width="16" stroke-linecap="round"/>
    <path d="M595 425l38 30-38 30" fill="none" stroke="#ffe08a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="665" y="250" width="420" height="420" rx="34" fill="#f8fafc"/>
    <text x="710" y="315" fill="#07324a" font-size="35" font-weight="700">Estrutura lógica</text>
    <rect x="710" y="365" width="330" height="64" rx="14" fill="#bfe8f2"/><text x="740" y="407" fill="#07324a" font-size="25">TABELA leitor</text>
    <rect x="710" y="455" width="330" height="64" rx="14" fill="#ffd7c8"/><text x="740" y="497" fill="#07324a" font-size="25">TABELA livro</text>
    <rect x="710" y="545" width="330" height="78" rx="14" fill="#ffe08a"/><text x="740" y="578" fill="#07324a" font-size="24">TABELA empréstimo</text><text x="740" y="607" fill="#07324a" font-size="20">FK leitor • FK exemplar</text>
    <path d="M1125 455H1245" stroke="#ff9f7f" stroke-width="16" stroke-linecap="round"/>
    <path d="M1220 425l38 30-38 30" fill="none" stroke="#ff9f7f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1290" y="250" width="220" height="420" rx="34" fill="#6d4aff"/>
    <ellipse cx="1400" cy="360" rx="72" ry="28" fill="#eae5ff"/><rect x="1328" y="360" width="144" height="145" fill="#eae5ff"/><ellipse cx="1400" cy="505" rx="72" ry="28" fill="#c8bbff"/>
    <text x="1334" y="585" fill="white" font-size="29" font-weight="700">Banco</text><text x="1320" y="622" fill="white" font-size="25">persistente</text>
    <rect x="90" y="735" width="1420" height="80" rx="24" fill="#123a59"/>
    <text x="135" y="785" fill="#f8fafc" font-size="29"><tspan font-weight="700">Chaves</tspan> identificam • <tspan font-weight="700">relacionamentos</tspan> conectam • <tspan font-weight="700">restrições</tspan> protegem</text>
  </g>
</svg>


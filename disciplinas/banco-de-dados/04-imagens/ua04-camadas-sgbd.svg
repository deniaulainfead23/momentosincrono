<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Camadas e serviços de um SGBD</title><desc id="desc">Aplicações e pessoas usam o SGBD, que oferece consulta, segurança, integridade, transações, catálogo e recuperação sobre os dados.</desc>
  <rect width="1600" height="900" fill="#ecfeff"/>
  <text x="90" y="105" fill="#083344" font-family="Arial,sans-serif" font-size="54" font-weight="700">UA4 • SGBD é o guardião entre uso e dados</text>
  <text x="92" y="158" fill="#0e7490" font-family="Arial,sans-serif" font-size="28">Ele recebe comandos, aplica regras e coordena acesso confiável.</text>
  <g font-family="Arial,sans-serif">
    <rect x="120" y="220" width="350" height="150" rx="28" fill="#0891b2"/><text x="190" y="282" fill="white" font-size="32" font-weight="700">PESSOAS</text><text x="190" y="328" fill="#cffafe" font-size="24">usuários • DBA</text>
    <rect x="1130" y="220" width="350" height="150" rx="28" fill="#0891b2"/><text x="1198" y="282" fill="white" font-size="32" font-weight="700">APLICAÇÕES</text><text x="1198" y="328" fill="#cffafe" font-size="24">web • móvel • BI</text>
    <path d="M470 295H650M1130 295H950" stroke="#0e7490" stroke-width="12"/>
    <rect x="610" y="205" width="380" height="500" rx="40" fill="#164e63"/>
    <text x="735" y="270" fill="white" font-size="38" font-weight="700">SGBD</text>
    <rect x="660" y="315" width="280" height="54" rx="14" fill="#67e8f9"/><text x="705" y="351" fill="#083344" font-size="24">CONSULTAS SQL</text>
    <rect x="660" y="390" width="280" height="54" rx="14" fill="#a5f3fc"/><text x="705" y="426" fill="#083344" font-size="24">INTEGRIDADE</text>
    <rect x="660" y="465" width="280" height="54" rx="14" fill="#67e8f9"/><text x="705" y="501" fill="#083344" font-size="24">TRANSAÇÕES</text>
    <rect x="660" y="540" width="280" height="54" rx="14" fill="#a5f3fc"/><text x="705" y="576" fill="#083344" font-size="24">SEGURANÇA</text>
    <rect x="660" y="615" width="280" height="54" rx="14" fill="#67e8f9"/><text x="680" y="651" fill="#083344" font-size="23">CATÁLOGO • BACKUP</text>

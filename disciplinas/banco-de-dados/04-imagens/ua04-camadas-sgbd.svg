    <ellipse cx="800" cy="770" rx="230" ry="45" fill="#155e75"/><rect x="570" y="770" width="460" height="55" fill="#155e75"/><ellipse cx="800" cy="825" rx="230" ry="45" fill="#0e7490"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ACID e ambientes de banco de dados</title><desc id="desc">Quatro propriedades ACID cercam uma transação, com desenvolvimento, teste e produção na base.</desc>
  <rect width="1600" height="900" fill="#fff7ed"/>
  <text x="90" y="110" fill="#4c1d1d" font-family="Arial,sans-serif" font-size="54" font-weight="700">UA2 • Uma transação confiável</text>
  <text x="92" y="165" fill="#8b3a2b" font-family="Arial,sans-serif" font-size="28">Mudanças relacionadas devem chegar juntas a um estado válido.</text>
  <g font-family="Arial,sans-serif">
    <circle cx="800" cy="430" r="155" fill="#7c2d12"/><text x="680" y="415" fill="white" font-size="34" font-weight="700">EMPRÉSTIMO</text><text x="690" y="462" fill="#fed7aa" font-size="27">uma transação</text>
    <rect x="125" y="265" width="360" height="145" rx="28" fill="#ef4444"/><text x="165" y="325" fill="white" font-size="31" font-weight="700">A • Atomicidade</text><text x="165" y="368" fill="white" font-size="24">Tudo ou nada</text>
    <rect x="1115" y="265" width="360" height="145" rx="28" fill="#f97316"/><text x="1155" y="325" fill="white" font-size="31" font-weight="700">C • Consistência</text><text x="1155" y="368" fill="white" font-size="24">Regras preservadas</text>
    <rect x="125" y="485" width="360" height="145" rx="28" fill="#0f766e"/><text x="165" y="545" fill="white" font-size="31" font-weight="700">I • Isolamento</text><text x="165" y="588" fill="white" font-size="24">Concorrência controlada</text>
    <rect x="1115" y="485" width="360" height="145" rx="28" fill="#4338ca"/><text x="1155" y="545" fill="white" font-size="31" font-weight="700">D • Durabilidade</text><text x="1155" y="588" fill="white" font-size="24">COMMIT permanece</text>
    <path d="M490 337L650 390M1110 337L950 390M490 557L650 475M1110 557L950 475" stroke="#7c2d12" stroke-width="8" stroke-linecap="round"/>
    <text x="90" y="730" fill="#4c1d1d" font-size="28" font-weight="700">Ambientes separados, responsabilidades distintas</text>
    <rect x="90" y="760" width="430" height="82" rx="20" fill="#fde68a"/><text x="205" y="812" fill="#4c1d1d" font-size="27">DESENVOLVIMENTO</text>
    <rect x="585" y="760" width="430" height="82" rx="20" fill="#fdba74"/><text x="730" y="812" fill="#4c1d1d" font-size="27">TESTE</text>
    <rect x="1080" y="760" width="430" height="82" rx="20" fill="#fb7185"/><text x="1205" y="812" fill="#4c1d1d" font-size="27">PRODUÇÃO</text>
  </g>
</svg>

